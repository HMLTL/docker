apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-dev
  namespace: flux-system
spec:
  interval: 1m                    # звіряти стан з git щохвилини
  releaseName: course-app
  targetNamespace: development    # Етап 3: окремий namespace
  dependsOn:
    - name: dragonfly-operator    # дочекатись CRD Dragonfly перед створенням інстанса БД
      namespace: flux-system
  driftDetection:
    mode: enabled                 # Flux відновлює вручну змінені/видалені ресурси (Drift Check)
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./charts/course-app
      sourceRef:
        kind: GitRepository
        name: flux-system         # створено командою flux bootstrap
        namespace: flux-system
  # Перевизначення дефолтів чарту для development
  values:
    replicaCount: 1               # 1 репліка застосунку
    ingress:
      host: course-app.dev.local
    hpa:
      enabled: false
    dragonfly:
      enabled: true
      replicas: 1                 # 1 інстанс БД
